# Zyoza landing page, Studio and docs: one small machine, no HA.
# Deploy with: fly deploy --ha=false
app = "zyoza"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  ZYOZA_LISTEN = "0.0.0.0:8080"

[http_service]
  internal_port = 8080
  force_https = true
  # Stop when idle and wake on the next request. Studio state is in memory, so a stop resets it.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

  [[http_service.checks]]
    method = "GET"
    path = "/"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

# Sized from measurement: the Ragu prover peaks near 360 MB, so 512 MB is too tight.
# The prover is multi-threaded, so proving time scales with vCPUs: 4-5 s per fold on 2x.
# Do not go down to shared-cpu-1x: it starts at ~7 s per fold, then exhausts its CPU burst
# allowance after a handful of proofs and drops to ~90-100 s each.
[[vm]]
  size = "shared-cpu-4x"
  memory = "1gb"
