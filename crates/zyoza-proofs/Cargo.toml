[package]
name = "zyoza-proofs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
blake2b_simd.workspace = true
ragu.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zyoza-core.workspace = true

# Enable multi-core Rayon MSM/FFT acceleration automatically on native targets
# (macOS, Linux, Windows, iOS, Android), while keeping wasm32 single-threaded.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ragu = { workspace = true, features = ["multicore", "asm"] }
