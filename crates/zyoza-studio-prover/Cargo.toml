[package]
name = "zyoza-studio-prover"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
blake2b_simd.workspace = true
serde.workspace = true
serde_json.workspace = true
zyoza-core.workspace = true
zyoza-proofs.workspace = true

# Browser build: `scripts/build-studio-wasm.sh`. Randomness comes from the page's Web Crypto.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
